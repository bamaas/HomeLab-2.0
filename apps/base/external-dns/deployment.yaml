---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: external-dns
  template:
    metadata:
      labels:
        app: external-dns
    spec:
      serviceAccountName: external-dns
      containers:
        - name: external-dns
          image: registry.k8s.io/external-dns/external-dns:v0.23.0
          args:
            - --source=service
            - --source=ingress
            # TXT ownership records: with --policy=sync, external-dns only deletes
            # records it created itself, never the manual ones in UniFi.
            - --registry=txt
            - --txt-owner-id=external-dns
            - --txt-prefix=k8s.%{record_type}-
            - --policy=sync
            - --provider=webhook
        - name: unifi-webhook
          image: ghcr.io/home-operations/external-dns-unifi-webhook:0.10.12
          env:
            - name: UNIFI_HOST
              value: https://192.168.8.1
            - name: UNIFI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: unifi-api-key
                  key: UNIFI_API_KEY
            # Keeps retries within external-dns' 15s webhook budget, see the webhook README.
            - name: UNIFI_REQUEST_TIMEOUT
              value: 4s
          ports:
            - name: http-webhook
              containerPort: 8888
            - name: http-health
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http-health
            initialDelaySeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http-health
            initialDelaySeconds: 10
            timeoutSeconds: 5
      securityContext:
        fsGroup: 65534  # For ExternalDNS to be able to read Kubernetes token files
